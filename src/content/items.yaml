headshot-booster:
  name: "Headshot Booster"
  category: Weapon
  tier: 1
  cost: 800
  image: "Headshot_Booster.png"
  source:
    url: "https://deadlock.wiki/Headshot_Booster"
    oldid: 204468
  stats:
    - text: "+30 Bonus Health"
      value: 30
      label: "Bonus Health"
  passive:
    th: "ยิงโดนหัว Hero ศัตรูนัดถัดไป จะได้ดาเมจอาวุธเพิ่ม"
    en: "Your next headshot against an enemy Hero deals bonus weapon damage."
    cooldownSeconds: 9
    stats:
      - text: "+45 Head Shot Bonus Damage"
        value: 45
        label: "Head Shot Bonus Damage"
  componentOf: ["Headhunter"]
  notes:
    - th: "ไม่ทำงานเมื่อยิงหัว Trooper ศัตรู หรือ NPC อื่นที่มี hitbox หัว"
      en: "This item does not activate when headshotting enemy Troopers, or any other NPC in possession of a headshot hitbox."
    - th: "ดาเมจโบนัสจากการยิงหัวลดลงตามระยะ (damage falloff) ของ Hero"
      en: "The bonus headshot weapon damage is affected by your Hero's damage falloff variables."
    - th: "อาวุธแบบ shotgun ต้องให้เม็ดตรงกลางโดนหัวถึงจะนับ"
      en: "For shotgun weapons, the centermost pellet must be a headshot to count."
    - th: "Graves และ Deadman Danny ซื้อ Item นี้ไม่ได้ เพราะทำ critical damage ไม่ได้"
      en: "This item can't be purchased by Graves or Deadman Danny, as they are incapable of dealing critical damage."

