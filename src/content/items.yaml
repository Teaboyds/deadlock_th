monster-rounds:
  name: "Monster Rounds"
  category: Weapon
  tier: 1
  cost: 800
  image: "Monster_Rounds.png"
  source:
    url: "https://deadlock.wiki/Monster_Rounds"
    oldid: 218116
  stats:
    - text: "+25% Weapon Damage vs. NPCs"
      value: 25
      unit: "%"
      label: "Weapon Damage vs. NPCs"
    - text: "+25% Bullet Resist vs. NPCs"
      value: 25
      unit: "%"
      label: "Bullet Resist vs. NPCs"
    - text: "+1 Out of Combat Regen"
      value: 1
      label: "Out of Combat Regen"
  componentOf: ["Cultist Sacrifice"]
  notes:
    - th: "เพิ่มดาเมจใส่ NPC ทุกแบบ ได้แก่ Trooper, Neutral รวมถึง Mid-Boss, สิ่งก่อสร้างในเลน และเป้าหมายของทีม เช่น Guardian, Walker, Shrine และ Patron"
      en: "Monster Rounds applies additional damage to Non-Player Characters. This includes Troopers, Neutral entities including the Mid-Boss, as well as lane structures and team objectives such as Guardians, Walkers, Shrines, and the Patron."
    - th: "Bullet Resist ที่เพิ่ม ลดดาเมจจาก Trooper, Neutral, Mid-Boss และ Guardian แต่ไม่มีผลกับ Walker, Shrine, Patron และตัวที่ Graves, McGinnis และ Rem เรียกออกมา เพราะพวกนี้ทำ Spirit Damage"
      en: "The bonus Bullet Resist reduces damage from Troopers, Neutrals, Mid-Boss and Guardians but has no effect against Walkers, Shrines, the Patron, and Graves', McGinnis' and Rem's summons, since they deal Spirit Damage."
  affectedAbilities:
    - hero: "Graves"
      ability: "Jar of Dead"
    - hero: "Graves"
      ability: "Grasping Hands"
      th: "ghoul ปกติ และ ghoul ที่เพิ่มจาก T3"
      en: "Base ghoul + T3 additional ghoul."
    - hero: "Graves"
      ability: "Borrowed Decree"
    - hero: "McGinnis"
      ability: "Mini Turret"
    - hero: "McGinnis"
      ability: "Spectral Wall"
      th: "turret จาก T3"
      en: "T3 turrets."
    - hero: "Rem"
      ability: "Lil Helpers"
      th: "มีผลกับ trooper ที่ helper ตามอยู่"
      en: "Affects trooper followed by helper."
  needsReview: true  # Thai notes for the affected-abilities table are a best reading of short wiki notes; check them.

